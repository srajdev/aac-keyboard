<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Viraj Keyboard</title>
    <link rel="stylesheet" href="/static/styles/main.css?v=15">
</head>
<body>
    <!-- Password Gate -->
    <div id="password-gate" class="password-gate">
        <div class="password-box">
            <h2>Viraj Keyboard</h2>
            <p>Enter password to continue</p>
            <input type="password" id="password-input" placeholder="Password">
            <button id="password-submit" onclick="Auth.checkPassword()">Enter</button>
            <p id="password-error" class="password-error"></p>
        </div>
    </div>

    <div id="app" style="display: none;">
        <!-- Header with Settings Button, Connection Status, and Context -->
        <header class="header">
            <div class="header-left">
                <button id="settings-btn" class="settings-btn" aria-label="Open settings">
                    <span class="settings-icon">⚙️</span>
                    <span class="settings-text">Settings</span>
                </button>
                <button id="quick-listen-toggle" class="settings-btn" aria-label="Toggle listening">
                    <span class="settings-icon">🎤</span>
                    <span class="settings-text">Listen: OFF</span>
                </button>
            </div>
            <div class="connection-status">
                <span class="connection-label">Connection:</span>
                <span class="connection-indicator" id="ws-status" title="Connecting...">...</span>
            </div>
            <input type="text" id="explicit-context-input" class="context-input" placeholder="Add context..." aria-label="Additional context">
        </header>

        <!-- Message Area with CLEAR button -->
        <section class="message-section-new">
            <div class="message-header">
                <div id="message-area" class="message-area-new">
                    <span id="message-before" class="message-text"></span>
                    <span class="cursor"></span>
                    <span id="message-after" class="message-text"></span>
                </div>
                <button id="clear-btn" class="clear-btn-new" aria-label="Clear all">CLEAR</button>
            </div>
        </section>

        <!-- Predictions Section (side-by-side: phrases left 60%, words right 40%) -->
        <section class="predictions-section-new">
            <!-- Phrase Predictions (Left 60%) - SHARED by both layouts -->
            <div class="phrases-container">
                <div id="phrase-predictions" class="phrase-predictions-new">
                    <button class="phrase-btn-new" data-index="0">Loading...</button>
                    <button class="phrase-btn-new" data-index="1">Loading...</button>
                    <button class="phrase-btn-new" data-index="2">Loading...</button>
                </div>
            </div>

            <!-- Word Predictions (Right 40%) - Traditional Layout -->
            <div class="words-container words-traditional">
                <div id="word-predictions" class="word-predictions-new">
                    <button class="word-btn-new" data-index="0">...</button>
                    <button class="word-btn-new" data-index="1">...</button>
                    <button class="word-btn-new" data-index="2">...</button>
                    <button class="word-btn-new" data-index="3">...</button>
                    <button class="word-btn-new" data-index="4">...</button>
                    <button class="word-btn-new" data-index="5">...</button>
                </div>
            </div>
        </section>

        <!-- Custom 6-Row Keyboard -->
        <section class="keyboard-section-new">
            <!-- Letter Keyboard -->
            <div id="keyboard" class="keyboard-new">
                <!-- Number Row (toggleable with 123 button) -->
                <div id="number-row" class="keyboard-row-new" style="display: none;">
                    <button class="key-new key-letter" data-key="1">1</button>
                    <button class="key-new key-letter" data-key="2">2</button>
                    <button class="key-new key-letter" data-key="3">3</button>
                    <button class="key-new key-letter" data-key="4">4</button>
                    <button class="key-new key-letter" data-key="5">5</button>
                    <button class="key-new key-letter" data-key="6">6</button>
                    <button class="key-new key-letter" data-key="7">7</button>
                    <button class="key-new key-letter" data-key="8">8</button>
                    <button class="key-new key-letter" data-key="9">9</button>
                    <button class="key-new key-letter" data-key="0">0</button>
                </div>

                <!-- Row 1: Q W E R T [SPEAK (wide)] -->
                <div class="keyboard-row-new">
                    <button class="key-new key-letter" data-key="q">Q</button>
                    <button class="key-new key-letter" data-key="w">W</button>
                    <button class="key-new key-letter" data-key="e">E</button>
                    <button class="key-new key-letter" data-key="r">R</button>
                    <button class="key-new key-letter" data-key="t">T</button>
                    <button class="key-new key-action key-wide" data-key="speak">SPEAK</button>
                </div>

                <!-- Row 2: [↑] [↓] Y U O I P -->
                <div class="keyboard-row-new">
                    <button class="key-new key-arrow" data-key="arrow-up">↑</button>
                    <button class="key-new key-arrow" data-key="arrow-down">↓</button>
                    <button class="key-new key-letter" data-key="y">Y</button>
                    <button class="key-new key-letter" data-key="u">U</button>
                    <button class="key-new key-letter" data-key="o">O</button>
                    <button class="key-new key-letter" data-key="i">I</button>
                    <button class="key-new key-letter" data-key="p">P</button>
                </div>

                <!-- Row 3: [SHIFT] A S D F [DEL WORD] [BKSP] -->
                <div class="keyboard-row-new">
                    <button class="key-new key-modifier" data-key="shift" id="shift-key">SHIFT</button>
                    <button class="key-new key-letter" data-key="a">A</button>
                    <button class="key-new key-letter" data-key="s">S</button>
                    <button class="key-new key-letter" data-key="d">D</button>
                    <button class="key-new key-letter" data-key="f">F</button>
                    <button class="key-new key-action" data-key="del-word">DEL WORD</button>
                    <button class="key-new key-action" data-key="backspace">BKSP</button>
                </div>

                <!-- Row 4: [123] G H J K L ? -->
                <div class="keyboard-row-new">
                    <button class="key-new key-modifier" data-key="123" id="num-key">123</button>
                    <button class="key-new key-letter" data-key="g">G</button>
                    <button class="key-new key-letter" data-key="h">H</button>
                    <button class="key-new key-letter" data-key="j">J</button>
                    <button class="key-new key-letter" data-key="k">K</button>
                    <button class="key-new key-letter" data-key="l">L</button>
                    <button class="key-new key-punct" data-key="?">?</button>
                </div>

                <!-- Row 5: Z X C V B N M -->
                <div class="keyboard-row-new">
                    <button class="key-new key-letter" data-key="z">Z</button>
                    <button class="key-new key-letter" data-key="x">X</button>
                    <button class="key-new key-letter" data-key="c">C</button>
                    <button class="key-new key-letter" data-key="v">V</button>
                    <button class="key-new key-letter" data-key="b">B</button>
                    <button class="key-new key-letter" data-key="n">N</button>
                    <button class="key-new key-letter" data-key="m">M</button>
                </div>

                <!-- Row 6: [,.!?] [SORRY, I GOOFED UP!] [←] [SPACE] [→] [. (larger)] -->
                <div class="keyboard-row-new">
                    <button class="key-new key-punct" data-key="punct-menu">,.!?</button>
                    <button class="key-new key-phrase" data-key="phrase-goof">SORRY, I GOOFED UP!</button>
                    <button class="key-new key-arrow" data-key="arrow-left">←</button>
                    <button class="key-new key-space" data-key="space">SPACE</button>
                    <button class="key-new key-arrow" data-key="arrow-right">→</button>
                    <button class="key-new key-punct key-period-large" data-key="period">.</button>
                </div>
            </div>

            <!-- Number Keyboard (hidden by default) -->
            <div id="number-keyboard" class="keyboard-new number-keyboard" style="display: none;">
                <div class="keyboard-row-new">
                    <button class="key-new key-letter" data-key="1">1</button>
                    <button class="key-new key-letter" data-key="2">2</button>
                    <button class="key-new key-letter" data-key="3">3</button>
                    <button class="key-new key-letter" data-key="4">4</button>
                    <button class="key-new key-letter" data-key="5">5</button>
                </div>
                <div class="keyboard-row-new">
                    <button class="key-new key-letter" data-key="6">6</button>
                    <button class="key-new key-letter" data-key="7">7</button>
                    <button class="key-new key-letter" data-key="8">8</button>
                    <button class="key-new key-letter" data-key="9">9</button>
                    <button class="key-new key-letter" data-key="0">0</button>
                </div>
                <div class="keyboard-row-new">
                    <button class="key-new key-punct" data-key="!">!</button>
                    <button class="key-new key-modifier" data-key="abc">ABC</button>
                </div>
            </div>

            <!-- SwiftKey QWERTY Keyboard (hidden by default) -->
            <div id="keyboard-swiftkey" class="keyboard-new keyboard-swiftkey" style="display: none;">
                <!-- Row 1: Top prediction row (Delete | WP 4 | WP 5 | Speak) -->
                <div class="keyboard-row-new prediction-top-row-swiftkey">
                    <button class="key-new prediction-action-btn" id="swiftkey-delete" aria-label="Clear message">Delete</button>
                    <button class="key-new word-btn-swiftkey" data-index="3">...</button>
                    <button class="key-new word-btn-swiftkey" data-index="4">...</button>
                    <button class="key-new prediction-action-btn" id="swiftkey-speak" aria-label="Speak message">🔊 Speak</button>
                </div>

                <!-- Row 2: Word predictions (Word 1 | Word 2 | Word 3) -->
                <div class="keyboard-row-new prediction-word-row-swiftkey">
                    <button class="key-new word-btn-swiftkey" data-index="0">...</button>
                    <button class="key-new word-btn-swiftkey" data-index="1">...</button>
                    <button class="key-new word-btn-swiftkey" data-index="2">...</button>
                </div>

                <!-- Row 3: Numbers 1-0 (hidden by default, toggle with 123 button) -->
                <div class="keyboard-row-new" style="display: none;">
                    <button class="key-new key-letter-swiftkey" data-key="1">1</button>
                    <button class="key-new key-letter-swiftkey" data-key="2">2</button>
                    <button class="key-new key-letter-swiftkey" data-key="3">3</button>
                    <button class="key-new key-letter-swiftkey" data-key="4">4</button>
                    <button class="key-new key-letter-swiftkey" data-key="5">5</button>
                    <button class="key-new key-letter-swiftkey" data-key="6">6</button>
                    <button class="key-new key-letter-swiftkey" data-key="7">7</button>
                    <button class="key-new key-letter-swiftkey" data-key="8">8</button>
                    <button class="key-new key-letter-swiftkey" data-key="9">9</button>
                    <button class="key-new key-letter-swiftkey" data-key="0">0</button>
                </div>

                <!-- Row 2: Q-P -->
                <div class="keyboard-row-new">
                    <button class="key-new key-letter-swiftkey" data-key="q">Q</button>
                    <button class="key-new key-letter-swiftkey" data-key="w">W</button>
                    <button class="key-new key-letter-swiftkey" data-key="e">E</button>
                    <button class="key-new key-letter-swiftkey" data-key="r">R</button>
                    <button class="key-new key-letter-swiftkey" data-key="t">T</button>
                    <button class="key-new key-letter-swiftkey" data-key="y">Y</button>
                    <button class="key-new key-letter-swiftkey" data-key="u">U</button>
                    <button class="key-new key-letter-swiftkey" data-key="i">I</button>
                    <button class="key-new key-letter-swiftkey" data-key="o">O</button>
                    <button class="key-new key-letter-swiftkey" data-key="p">P</button>
                </div>

                <!-- Row 3: A-L (offset to align A with W) -->
                <div class="keyboard-row-new swiftkey-offset">
                    <button class="key-new key-letter-swiftkey" data-key="a">A</button>
                    <button class="key-new key-letter-swiftkey" data-key="s">S</button>
                    <button class="key-new key-letter-swiftkey" data-key="d">D</button>
                    <button class="key-new key-letter-swiftkey" data-key="f">F</button>
                    <button class="key-new key-letter-swiftkey" data-key="g">G</button>
                    <button class="key-new key-letter-swiftkey" data-key="h">H</button>
                    <button class="key-new key-letter-swiftkey" data-key="j">J</button>
                    <button class="key-new key-letter-swiftkey" data-key="k">K</button>
                    <button class="key-new key-letter-swiftkey" data-key="l">L</button>
                </div>

                <!-- Row 4: SHIFT Z-M BACKSPACE -->
                <div class="keyboard-row-new">
                    <button class="key-new key-modifier-swiftkey" id="shift-key-swiftkey" data-key="shift">⇧</button>
                    <button class="key-new key-letter-swiftkey" data-key="z">Z</button>
                    <button class="key-new key-letter-swiftkey" data-key="x">X</button>
                    <button class="key-new key-letter-swiftkey" data-key="c">C</button>
                    <button class="key-new key-letter-swiftkey" data-key="v">V</button>
                    <button class="key-new key-letter-swiftkey" data-key="b">B</button>
                    <button class="key-new key-letter-swiftkey" data-key="n">N</button>
                    <button class="key-new key-letter-swiftkey" data-key="m">M</button>
                    <button class="key-new key-action-swiftkey" data-key="backspace">⌫</button>
                </div>

                <!-- Row 5: 123 , ? SPACE DW Punct ENTER -->
                <div class="keyboard-row-new">
                    <button class="key-new key-modifier-swiftkey" data-key="123">123</button>
                    <button class="key-new key-letter-swiftkey" data-key=",">,</button>
                    <button class="key-new key-letter-swiftkey" data-key="?">?</button>
                    <button class="key-new key-space-swiftkey key-space-wide" data-key="space">SPACE</button>
                    <button class="key-new key-action-swiftkey" data-key="del-word">DW</button>
                    <button class="key-new key-punct-swiftkey" data-key="punct-menu">,.!?</button>
                    <button class="key-new key-action-swiftkey" data-key="enter">↵</button>
                </div>

                <!-- Row 6: Sorry | Arrows -->
                <div class="keyboard-row-new keyboard-row-small">
                    <button class="key-new key-phrase-swiftkey" data-key="phrase-goof">Sorry</button>
                    <button class="key-new key-arrow-swiftkey" data-key="arrow-up">↑</button>
                    <button class="key-new key-arrow-swiftkey" data-key="arrow-down">↓</button>
                    <button class="key-new key-arrow-swiftkey" data-key="arrow-left">←</button>
                    <button class="key-new key-arrow-swiftkey" data-key="arrow-right">→</button>
                </div>
            </div>
        </section>

        <!-- Context Panel (Always Visible) -->
        <section id="context-section" class="context-section">
            <div id="context-content" class="context-content">
                <p id="context-text">No conversation captured yet. Tap "Listen" to start.</p>
            </div>
        </section>
    </div>

    <!-- Punctuation Modal -->
    <div id="punctuation-modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content punctuation-grid">
            <button class="punct-btn" data-char=",">,</button>
            <button class="punct-btn" data-char=".">.</button>
            <button class="punct-btn" data-char="!">!</button>
            <button class="punct-btn" data-char="?">?</button>
            <button class="punct-btn" data-char="@">@</button>
            <button class="punct-btn" data-char="#">#</button>
            <button class="punct-btn" data-char="$">$</button>
            <button class="punct-btn" data-char="%">%</button>
            <button class="punct-btn" data-char=";">;</button>
            <button class="punct-btn" data-char=":">:</button>
            <button class="punct-btn" data-char="'">'</button>
            <button class="punct-btn" data-char='"'>"</button>
            <button class="punct-btn" data-char="^">^</button>
            <button class="punct-btn" data-char="&">&</button>
            <button class="punct-btn" data-char="*">*</button>
            <button class="punct-btn" data-char="-">-</button>
            <button class="punct-btn" data-char="(">(</button>
            <button class="punct-btn" data-char=")">)</button>
            <button class="punct-btn" data-char="/">/</button>
            <button class="punct-btn" data-char="+"">+</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content settings-panel">
            <h2 class="settings-title">Settings</h2>

            <div class="settings-section">
                <h3>Features</h3>
                <div class="setting-row">
                    <button id="predictions-toggle" class="toggle-btn-setting" aria-label="Toggle predictions">
                        <span class="toggle-icon">🤖</span>
                        <span class="toggle-text">AI: ON</span>
                    </button>
                </div>
                <div class="setting-row">
                    <button id="listen-toggle" class="toggle-btn-setting" aria-label="Toggle listening">
                        <span class="toggle-icon">🎤</span>
                        <span class="toggle-text">Listen: OFF</span>
                    </button>
                </div>
            </div>

            <div class="settings-section">
                <h3>Model Selection</h3>
                <div class="setting-row">
                    <label for="model-selector" class="model-label">AI Model:</label>
                    <select id="model-selector" class="model-selector">
                        <option value="claude">Claude Haiku (Higher Quality)</option>
                        <option value="gemini">Gemini 2.5 Flash (Faster)</option>
                        <option value="gpt">GPT-4.1-nano (Fastest)</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h3>Keyboard Layout</h3>
                <div class="setting-row">
                    <label for="layout-selector" class="model-label">Layout:</label>
                    <select id="layout-selector" class="model-selector">
                        <option value="traditional">Traditional (6-row)</option>
                        <option value="swiftkey">SwiftKey (QWERTY)</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h3>Speech</h3>
                <div class="setting-row">
                    <label for="tts-mode-selector" class="model-label">Auto-speak:</label>
                    <select id="tts-mode-selector" class="model-selector">
                        <option value="sentence">Sentence (on . or ?)</option>
                        <option value="word">Word (after each word)</option>
                        <option value="manual">Manual (button only)</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h3>Voice</h3>
                <div class="setting-row">
                    <label for="voice-selector" class="model-label">Voice:</label>
                    <select id="voice-selector" class="model-selector">
                        <option value="">Auto (Best Male Voice)</option>
                        <!-- Voices populated dynamically -->
                    </select>
                </div>
                <div class="setting-row slider-row">
                    <label for="speech-rate-slider" class="model-label">Speed:</label>
                    <input type="range" id="speech-rate-slider" class="slider" min="0.5" max="2.0" step="0.1" value="0.9">
                    <span id="speech-rate-value" class="slider-value">0.9x</span>
                </div>
                <div class="setting-row slider-row">
                    <label for="speech-pitch-slider" class="model-label">Pitch:</label>
                    <input type="range" id="speech-pitch-slider" class="slider" min="0.5" max="2.0" step="0.1" value="1.0">
                    <span id="speech-pitch-value" class="slider-value">1.0x</span>
                </div>
                <div class="setting-row">
                    <button id="test-voice-btn" class="test-voice-btn">🔊 Test Voice</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>Size Controls</h3>
                <div class="setting-row width-control-row">
                    <label>Width:</label>
                    <button id="width-decrease" class="width-btn" aria-label="Decrease keyboard width">◄</button>
                    <span id="width-display" class="width-display">14cm</span>
                    <button id="width-increase" class="width-btn" aria-label="Increase keyboard width">►</button>
                    <button id="width-reset" class="width-reset">Reset</button>
                </div>
                <div class="setting-row width-control-row">
                    <label>Height:</label>
                    <button id="height-decrease" class="width-btn" aria-label="Decrease keyboard height">▼</button>
                    <span id="height-display" class="width-display">100%</span>
                    <button id="height-increase" class="width-btn" aria-label="Increase keyboard height">▲</button>
                    <button id="height-reset" class="width-reset">Reset</button>
                </div>
                <div class="setting-row width-control-row">
                    <label>Predictions:</label>
                    <button id="pred-width-decrease" class="width-btn" aria-label="Decrease prediction width">◄</button>
                    <span id="pred-width-display" class="width-display">Full</span>
                    <button id="pred-width-increase" class="width-btn" aria-label="Increase prediction width">►</button>
                    <button id="pred-width-reset" class="width-reset">Reset</button>
                </div>
            </div>

            <button id="settings-close" class="settings-close-btn">Close</button>
        </div>
    </div>

    <script src="/static/services/auth.js?v=20"></script>
    <script src="/static/services/websocket.js?v=20"></script>
    <script src="/static/services/api.js?v=20"></script>
    <script src="/static/services/speech.js?v=20"></script>
    <script src="/static/services/storage.js?v=20"></script>
    <script src="/static/components/MessageArea.js?v=20"></script>
    <script src="/static/components/Keyboard.js?v=20"></script>
    <script src="/static/components/Predictions.js?v=20"></script>
    <script src="/static/components/SpeakButton.js?v=20"></script>
    <script src="/static/components/ListenToggle.js?v=20"></script>
    <script src="/static/components/KeyboardWidthControl.js?v=20"></script>
    <script src="/static/components/KeyboardHeightControl.js?v=20"></script>
    <script src="/static/components/PredictionWidthControl.js?v=20"></script>
    <script src="/static/components/SettingsModal.js?v=20"></script>
    <script src="/static/app.js?v=20"></script>
</body>
</html>
